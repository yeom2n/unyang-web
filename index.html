<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>운양고 School-Hub</title>
    <style>
        /* 🎨 프리미엄 UI 색상 변수 */
        :root {
            --bg-color: #F3F4F6;
            --text-color: #1F2937;
            --card-bg: #FFFFFF;
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --secondary: #6B7280;
            --border: #E5E7EB;
            --accent-lunch: #10B981;
            --accent-exam: #EF4444;
            --radius: 20px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 🌙 다크 모드 프리미엄 색상 */
        body.dark-mode {
            --bg-color: #111827;
            --text-color: #F9FAFB;
            --card-bg: #1F2937;
            --primary: #6366F1;
            --primary-hover: #818CF8;
            --secondary: #9CA3AF;
            --border: #374151;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            transition: var(--transition);
        }

        .app-container {
            width: 100%;
            max-width: 850px; 
            margin: auto;
        }

        /* 뷰 컨테이너 */
        .view-box {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: var(--transition);
        }

        @media (max-width: 600px) {
            .view-box { padding: 25px 15px; }
            body { padding: 10px; }
        }

        h1, h2, h3, h4 { margin-top: 0; }
        .text-primary { color: var(--primary); }

        /* 입력 폼 디자인 */
        .input-group {
            display: flex;
            gap: 15px;
            margin: 30px 0;
        }
        
        select {
            flex: 1;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid var(--border);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 16px;
            font-weight: 600;
            outline: none;
            transition: var(--transition);
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 16px;
        }
        select:focus { border-color: var(--primary); }

        .btn {
            background-color: var(--primary);
            color: white;
            font-weight: 700;
            border: none;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:hover { background-color: var(--primary-hover); transform: translateY(-2px); }
        .btn-full { width: 100%; font-size: 18px; padding: 18px; }

        /* 대시보드 헤더 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header-title { font-size: 28px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .class-tag { background: var(--bg-color); padding: 5px 12px; border-radius: 10px; font-size: 16px; color: var(--primary); border: 1px solid var(--border); }

        /* D-Day 뱃지 */
        .badges { display: flex; gap: 10px; flex-wrap: wrap; }
        .badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 800;
            color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .b-vacation { background: linear-gradient(135deg, #F59E0B, #D97706); }
        .b-csat { background: linear-gradient(135deg, #EF4444, #B91C1C); }
        .b-exam { background: linear-gradient(135deg, #8B5CF6, #6D28D9); }

        /* 그리드 카드 레이아웃 */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }

        .card {
            background-color: var(--bg-color);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: 700;
        }

        .btn-icon {
            background: var(--card-bg); color: var(--text-color);
            border: 1px solid var(--border); padding: 6px 12px;
            border-radius: 20px; font-size: 12px; font-weight: 600;
            cursor: pointer; transition: 0.2s;
        }
        .btn-icon:hover { background: var(--border); }

        /* 시간표 세로 배치 테이블 (화면 너비에 맞춰 자동 축소) */
        .table-container { 
            width: 100%; 
            overflow-x: auto; 
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            table-layout: fixed; 
        }
        th, td {
            padding: 12px 5px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
            height: 30px; 
            word-break: keep-all; 
            font-size: 15px;
        }
        th { font-weight: 700; color: var(--secondary); padding-bottom: 15px; }
        td { font-weight: 600; }
        
        /* 알파벳 선택과목 강조 */
        .elective {
            background: var(--primary); color: white;
            padding: 5px 10px; border-radius: 8px; font-weight: 700; font-size: 14px;
            display: inline-block; box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2);
        }

        /* 📱 모바일 최적화 */
        @media (max-width: 600px) {
            th, td { padding: 10px 2px; font-size: 13px; }
            .elective { padding: 4px 6px; font-size: 12px; border-radius: 6px; }
        }

        /* 모달 팝업 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; visibility: hidden; transition: 0.3s;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        .modal-content {
            background: var(--card-bg); width: 90%; max-width: 700px;
            max-height: 85vh; border-radius: 24px; padding: 30px;
            overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transform: translateY(20px); transition: 0.3s;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }

        /* 기말고사 전용 테이블 */
        .exam-table th { background: var(--bg-color); border: 1px solid var(--border); }
        .exam-table td { border: 1px solid var(--border); font-size: 13px; padding: 10px; }
        @media (max-width: 600px) {
            .exam-table td { font-size: 11px; padding: 6px 2px; }
        }

        .hidden { display: none !important; }
        
        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- 1. 로그인 뷰 -->
    <div id="loginView" class="view-box">
        <div style="text-align: center; margin-bottom: 40px;">
            <div style="font-size: 50px; margin-bottom: 10px;">🏫</div>
            <h1 class="text-primary" style="font-size: 32px; font-weight: 900;">운양고 School-Hub</h1>
            <p style="color: var(--secondary); font-size: 16px;">우리 학교의 모든 정보를 한 곳에서 확인하세요.</p>
        </div>
        
        <div class="input-group">
            <select id="gradeSelect">
                <option value="1">1학년</option>
                <option value="2" selected>2학년</option>
                <option value="3">3학년</option>
            </select>
            <select id="classSelect">
                <option value="1">1반</option><option value="2">2반</option>
                <option value="3">3반</option><option value="4">4반</option>
                <option value="5">5반</option><option value="6">6반</option>
                <option value="7">7반</option><option value="8">8반</option>
                <option value="9">9반</option><option value="10">10반</option>
            </select>
        </div>
        <button class="btn btn-full" onclick="enterApp()">🚀 나의 대시보드 입장하기</button>
    </div>

    <!-- 2. 대시보드 뷰 -->
    <div id="dashboardView" class="view-box hidden">
        
        <div class="header">
            <div>
                <div class="header-title">
                    운양고 대시보드 <span class="class-tag" id="userClassInfo">2학년 3반</span>
                </div>
                <div class="badges" style="margin-top: 10px;">
                    <span id="examDdayBadge" class="badge b-exam">📝 시험 일정 확인 중</span>
                    <span id="vacationBadge" class="badge b-vacation">🌴 방학 일정 확인 중</span>
                    <span id="csatBadge" class="badge b-csat">🎯 수능 일정 확인 중</span>
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-icon" onclick="toggleDarkMode()">🌓 테마변경</button>
                <button class="btn-icon" onclick="logout()">🚪 로그아웃</button>
            </div>
        </div>

        <p id="dataStatus" role="status" style="color:var(--secondary);font-size:13px"></p>
        <button class="btn-icon" onclick="SchoolData.load()">정보 새로고침</button>
        <div class="grid-2" style="margin-top:15px">
            <!-- 급식 카드 -->
            <div class="card" style="border-left: 5px solid var(--accent-lunch);">
                <div class="card-header">
                    <span style="color: var(--accent-lunch);">🍱 <span id="lunchTitle">오늘의 급식</span></span>
                    <button class="btn-icon" onclick="openModal('lunchModal')">식단표 보기</button>
                </div>
                <p id="lunchContent" style="white-space:pre-line;font-size: 16px; line-height: 1.6; font-weight: 700; margin:0;">데이터 로딩중...</p>
            </div>

            <!-- 학사일정 카드 -->
            <div class="card" style="border-left: 5px solid var(--primary);">
                <div class="card-header">
                    <span class="text-primary">📅 최근 학사 일정</span>
                    <button class="btn-icon" onclick="openModal('calendarModal')">월별 일정 보기</button>
                </div>
                <ul id="recentEvents" style="padding-left:20px;line-height:1.8" aria-live="polite"><li>데이터를 불러오는 중입니다.</li></ul>
            </div>
        </div>

        <!-- 시간표 카드 -->
        <div class="card">
            <div class="card-header">⏱️ 우리 반 주간 시간표</div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>교시</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th>
                        </tr>
                    </thead>
                    <tbody id="timetableBody"></tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<!-- ================= 모달 영역 ================= -->

<!-- 나이스 데이터로 생성되는 월별 목록 -->
<div id="lunchModal" class="modal-overlay">
    <div class="modal-content">
        <h2>🍱 월별 급식 식단표</h2>
        <label for="mealMonth">조회 월 </label><input id="mealMonth" type="month">
        <p style="font-size:13px;color:var(--secondary)">메뉴의 숫자는 나이스 원문의 알레르기 표시입니다.</p>
        <div id="monthlyMeals" aria-live="polite"></div>
        <button class="btn" onclick="closeModal('lunchModal')">닫기</button>
    </div>
</div>
<div id="calendarModal" class="modal-overlay">
    <div class="modal-content">
        <h2>📅 월별 학사 일정</h2>

        <div id="monthlyEvents" aria-live="polite"></div>
        <button class="btn" onclick="closeModal('calendarModal')">닫기</button>
    </div>
</div>

    function enterApp() {
        const grade = document.getElementById("gradeSelect").value;
        const classNum = document.getElementById("classSelect").value;
        const key = `${grade}-${classNum}`;
        
        document.getElementById("userClassInfo").innerText = `${grade}학년 ${classNum}반`;

        SchoolData.load();

        const tbody = document.getElementById("timetableBody");
        tbody.innerHTML = ""; 
        
        // 데이터 없으면 에러 안나게 빈칸 배열 생성
        const emptyDayArr = ["", "", "", "", "", "", ""];
        const weekData = timetableDB[key] || [emptyDayArr, emptyDayArr, emptyDayArr, emptyDayArr, emptyDayArr];

        // 가독성 100% 확보된 세로형(교시 기준) 렌더링 로직
        for (let period = 0; period < 7; period++) {
            const tr = document.createElement("tr");
            
            // 1교시, 2교시 타이틀
            const th = document.createElement("th");
            th.innerText = `${period + 1}교시`;
            tr.appendChild(th);

            // 월,화,수,목,금 순서대로 채우기
            for (let day = 0; day < 5; day++) {
                const subject = weekData[day][period] || "";
                const td = document.createElement("td");
                
                if (grade !== "1" && subject.match(/[A-E]$/)) {
                    if ((subject.includes("문학") || subject.includes("영")) && !subject.includes("심영")) {
                        td.innerText = subject;
                    } else {
                        td.innerHTML = `<span class="elective">${subject.slice(-1)}</span>`;
                    }
                } else {
                    td.innerText = subject; 
                }
                tr.appendChild(td);
            }
            tbody.appendChild(tr);
        }

        document.getElementById("loginView").classList.add("hidden");
        document.getElementById("dashboardView").classList.remove("hidden");
    }

    function logout() {
        document.getElementById("dashboardView").classList.add("hidden");
        document.getElementById("loginView").classList.remove("hidden");
    }

    function toggleDarkMode() {
        document.body.classList.toggle("dark-mode");
    }

    function openModal(id) {
        const modal = document.getElementById(id);
        modal.classList.remove("hidden");
        setTimeout(() => modal.classList.add("active"), 10);
    }
    function closeModal(id) {
        const modal = document.getElementById(id);
        modal.classList.remove("active");
        setTimeout(() => modal.classList.add("hidden"), 300);
    }
